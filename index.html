<title>学習進捗管理ツール</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #16162a;
  --bg2: #1e1e38;
  --bg3: #252545;
  --border: rgba(255,255,255,0.08);
  --fg: #e8e0d0;
  --fg2: rgba(232,224,208,0.55);
  --fg3: rgba(232,224,208,0.28);
  --accent: #5b8dee;
  --accent-bg: rgba(91,141,238,0.12);
  --accent-border: rgba(91,141,238,0.3);
  --ok: #4eca8b;
  --ok-bg: rgba(78,202,139,0.12);
  --warn: #f5c842;
  --warn-bg: rgba(245,200,66,0.12);
  --danger: #e8534a;
  --danger-bg: rgba(232,83,74,0.12);
  --radius: 10px;
  --font: 'Noto Sans JP', sans-serif;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--fg);font-size:14px;-webkit-tap-highlight-color:transparent}
input,select,textarea,button{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{outline:none;color:var(--fg)}
select option{background:var(--bg2);color:var(--fg)}

#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto}
#content{flex:1;overflow-y:auto;padding:12px 14px 0;-webkit-overflow-scrolling:touch}
#nav{flex-shrink:0;display:flex;border-top:1px solid var(--border);background:var(--bg2);backdrop-filter:blur(12px);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 7px;border:none;background:none;color:var(--fg3);transition:color .15s}
.nav-btn.active{color:var(--accent)}
.nav-btn span:first-child{font-size:19px;line-height:1}
.nav-btn span:last-child{font-size:10px;font-weight:500}
.nav-indicator{width:16px;height:2px;border-radius:1px;background:var(--accent);opacity:0;transition:opacity .15s}
.nav-btn.active .nav-indicator{opacity:1}

#header{padding:12px 14px 10px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;max-width:600px;width:100%;margin:0 auto}
#header-left h1{font-size:15px;font-weight:700;color:var(--fg);letter-spacing:.02em}
#header-stats{display:flex;gap:10px;margin-top:3px}
.hstat{font-size:11px;color:var(--fg3)}
.hstat.red{color:rgba(232,83,74,.75)}
.hstat.green{color:rgba(78,202,139,.75)}
#header-right{display:flex;gap:8px;align-items:center}
#exam-badges-wrap{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;overflow:hidden;max-width:calc(100vw - 180px)}
.exam-chip{background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:8px;padding:4px 9px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.25;flex-shrink:0}
.exam-chip .exam-name{font-size:10px;color:var(--fg2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.exam-chip .days-row{display:flex;align-items:baseline;gap:2px;justify-content:center}
.exam-chip .days{font-size:15px;font-weight:700;color:var(--accent)}
.exam-chip .label{font-size:10px;color:var(--fg3)}
#menu-btn{width:34px;height:34px;border-radius:8px;background:var(--bg3);color:var(--fg2);font-size:18px;display:flex;align-items:center;justify-content:center}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.section-title{font-size:12px;font-weight:700;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--fg2);margin-bottom:4px;font-weight:500}
.input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--fg)}
.input:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:9px 16px;font-weight:700;transition:opacity .15s;border:none}
.btn:active{opacity:.75}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--bg3);color:var(--fg2);border:1px solid var(--border)}
.btn.danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(232,83,74,.25)}
.btn.ok{background:var(--ok-bg);color:var(--ok);border:1px solid rgba(78,202,139,.25)}
.btn.full{width:100%}
.btn.sm{padding:6px 12px;font-size:12px}
.progress-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h2{font-size:16px;font-weight:700}
.close-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--fg3);font-size:20px;background:var(--bg3)}

.palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pal-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s,transform .15s;position:relative}
.pal-dot.selected{border-color:var(--accent);transform:scale(1.18)}
.pal-dot.selected::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--fg);line-height:1}
.theme-palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.theme-dot{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s,transform .15s;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.theme-dot.selected{border-color:var(--accent);transform:scale(1.15)}
.theme-dot.selected::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#333;line-height:1}
.theme-dot[data-theme="dark"].selected::after{color:#fff}

/* Auth screen */
#auth-screen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
#auth-box{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:28px;width:100%;max-width:380px}
#auth-box .icon{text-align:center;font-size:44px;margin-bottom:10px}
#auth-box h1{text-align:center;font-size:20px;font-weight:700;margin-bottom:6px}
#auth-box .sub{text-align:center;color:var(--fg2);font-size:13px;margin-bottom:24px;line-height:1.6}
#auth-err{color:var(--danger);font-size:12px;text-align:center;margin-bottom:12px;min-height:18px}
.auth-tabs{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px}
.auth-tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:700;color:var(--fg3);cursor:pointer;transition:all .15s;background:none;border:none}
.auth-tab.active{background:var(--accent);color:#fff}
#auth-loading{text-align:center;color:var(--fg3);font-size:13px;padding:20px 0}

/* ===== Progress tab ===== */
.exam-section{margin-bottom:18px}

/* 試験カード */
.exam-card{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--exam-color,var(--accent));border-radius:var(--radius);overflow:hidden;margin-bottom:4px}
.exam-card-head{padding:12px 12px 10px}
.exam-card-title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.exam-card-name{font-size:16px;font-weight:700;color:var(--exam-color,var(--fg));line-height:1.2}
.exam-card-sub{font-size:11px;color:var(--fg3);margin-top:2px}
.exam-card-btns{display:flex;gap:5px;flex-shrink:0;margin-left:8px}
.exam-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ebadge{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid}
.ebadge.delay{background:rgba(232,83,74,.15);color:var(--danger);border-color:rgba(232,83,74,.3)}
.ebadge.behind{background:rgba(232,83,74,.15);color:var(--danger);border-color:rgba(232,83,74,.3)}
.ebadge.ok{background:rgba(78,202,139,.12);color:var(--ok);border-color:rgba(78,202,139,.25)}
.exam-pct-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.exam-pct{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.exam-pct.warn{color:var(--warn)}
.exam-pct.ok{color:var(--ok)}
.exam-total{font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums}
.exam-bar-wrap{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-bottom:6px}
.exam-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.exam-remain{font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.exam-remain .behind-num{color:var(--danger);font-weight:700}
.exam-remain .pace{color:var(--warn);font-weight:600}

/* 科目グリッド（横スクロール） */
.subj-indent{padding-left:12px}
.tb-indent{padding-left:0}
.sort-btn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:rgba(255,255,255,.06);color:var(--fg3);font-size:11px;cursor:pointer;border:none;flex-shrink:0}
.sort-btn:active{background:rgba(255,255,255,.12)}
.book-block{margin-bottom:8px}
.book-label{font-size:13px;font-weight:700;color:var(--fg);padding:8px 10px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);border-left:2px solid var(--subj-color,var(--border))}

/* 教材セル */
.sub-grid{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 10px 12px}
.sub-cell{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:11px 10px;min-width:130px}
.sub-cell .name{font-size:12px;font-weight:700;margin-bottom:6px;line-height:1.3}
.sub-cell .pct-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;margin-bottom:3px}
.sub-cell .done-lbl{font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.sub-cell .pct-lbl{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cell-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cbadge{display:inline-flex;align-items:center;gap:2px;padding:3px 7px;border-radius:6px;font-size:11px;font-weight:700;border:1px solid}
.cbadge.behind{background:rgba(232,83,74,.15);color:var(--danger);border-color:rgba(232,83,74,.3)}
.cbadge.delay{background:rgba(232,83,74,.15);color:var(--danger);border-color:rgba(232,83,74,.3)}
.cbadge.pace{background:rgba(245,200,66,.1);color:var(--warn);border-color:rgba(245,200,66,.25)}
.cbadge.today{background:rgba(78,202,139,.1);color:var(--ok);border-color:rgba(78,202,139,.2)}
.delta-row{display:flex;gap:3px;margin-top:8px}
.delta-btn{flex:1;background:rgba(255,255,255,.07);color:var(--fg2);border-radius:6px;padding:5px 0;font-size:12px;font-weight:700;border:none;cursor:pointer}
.delta-btn:hover{background:rgba(255,255,255,.12)}
.delta-btn:active{background:rgba(255,255,255,.18)}
.delta-btn.minus{color:var(--danger);background:rgba(232,83,74,.1)}
.archive-btn-mini{width:100%;background:rgba(245,200,66,.12);color:var(--warn);border:1px solid rgba(245,200,66,.25);border-radius:6px;padding:4px;font-size:11px;font-weight:700;cursor:pointer;margin-top:6px}
.empty-msg{text-align:center;color:var(--fg3);font-size:13px;padding:40px 0}

#study-sub-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
#study-sub-row select{flex:1;min-width:90px}
.answer-area{border-radius:var(--radius);border:1px solid;padding:14px}
.blank-row{display:flex;gap:5px;margin-bottom:10px}
.blank-btn{flex:1;border-radius:6px;padding:6px 0;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--bg3);color:var(--fg2);cursor:pointer;transition:all .1s}
.blank-btn.active{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent)}
.ans-btns{display:flex;gap:8px;margin-top:10px}
.ans-btn{flex:1;border-radius:10px;padding:12px;font-size:22px;font-weight:700;border:1px solid;cursor:pointer;transition:opacity .1s}
.ans-btn:active{opacity:.7}
.ans-ok{background:var(--ok-bg);border-color:rgba(78,202,139,.3);color:var(--ok)}
.ans-tri{background:var(--warn-bg);border-color:rgba(245,200,66,.3);color:var(--warn)}
.ans-ng{background:var(--danger-bg);border-color:rgba(232,83,74,.3);color:var(--danger)}
.study-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}

.mistake-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mstat{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px;text-align:center}
.mstat .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.mstat .lbl{font-size:10px;color:var(--fg3);margin-top:2px}
.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-row select{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 8px;color:var(--fg);font-size:12px}
.rem-section{margin-bottom:14px}
.rem-head{font-size:12px;font-weight:700;color:var(--danger);margin-bottom:7px}
.qcard{background:var(--bg2);border:1px solid var(--border);border-radius:9px;margin-bottom:7px;overflow:hidden}
.qcard-head{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer}
.qcard-head .sub-tag{font-size:11px;font-weight:700;flex-shrink:0}
.qcard-head .book-tag{font-size:10px;color:var(--fg3);flex-shrink:0}
.qcard-head .memo-preview{flex:1;font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qcard-head .chevron{font-size:11px;color:var(--fg3);flex-shrink:0}
.qcard-body{padding:0 10px 10px;border-top:1px solid rgba(255,255,255,.05)}
.qcard-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;padding-top:8px}
.rev-btns{display:flex;gap:6px;margin-top:8px}
.rev-btn{flex:1;border-radius:6px;padding:6px;font-size:13px;font-weight:700;cursor:pointer;border:none}
.rev-ok{background:var(--ok-bg);color:var(--ok)}
.rev-tri{background:var(--warn-bg);color:var(--warn)}
.rev-ng{background:var(--danger-bg);color:var(--danger)}
.rev-del{background:rgba(255,255,255,.05);color:var(--fg3);font-size:12px;padding:6px 8px}

.share-hero{background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:14px;padding:18px;margin-bottom:14px}
.share-date{font-size:12px;color:var(--fg2);margin-bottom:6px}
.share-count{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.share-count span{font-size:14px;font-weight:400;color:var(--fg2);margin-left:4px}
.share-row{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.share-stat{font-size:12px;color:var(--fg2)}
/* 今日の成果タブ */
.today-hero{background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:14px;padding:18px;margin-bottom:14px}
.today-date{font-size:12px;color:var(--fg2);margin-bottom:6px;font-variant-numeric:tabular-nums}
.today-total-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.today-total-num{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.today-total-unit{font-size:14px;color:var(--fg2)}
.today-goal-chip{font-size:13px;font-weight:700;margin-left:4px}
.today-stats-row{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.today-stat{font-size:12px;color:var(--fg2)}
.today-stat.ok{color:var(--ok)}
.today-stat.streak{font-weight:700}
.today-section-title{font-size:13px;font-weight:700;color:var(--fg2);margin:14px 0 8px;letter-spacing:.03em}
.complete-row{display:flex;align-items:center;gap:10px;background:rgba(78,202,139,.08);border:1px solid rgba(78,202,139,.2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.complete-icon{font-size:20px;flex-shrink:0}
.complete-info{flex:1;min-width:0}
.complete-name{font-size:14px;font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.complete-sub{font-size:11px;color:var(--fg3);margin-top:2px}
.complete-badge{font-size:13px;font-weight:700;color:var(--ok);background:rgba(78,202,139,.15);border:1px solid rgba(78,202,139,.3);border-radius:6px;padding:3px 8px;flex-shrink:0}

#dropdown{position:fixed;top:56px;right:14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;min-width:170px;z-index:90;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.dd-item{display:block;width:100%;padding:12px 15px;text-align:left;border-bottom:1px solid var(--border);color:var(--fg2);font-size:13px;background:none;border-left:none;border-right:none;border-top:none;cursor:pointer}
.dd-item:last-child{border-bottom:none}
.dd-item:active{background:var(--bg3)}

[hidden]{display:none!important}
.mt8{margin-top:8px}
.mt12{margin-top:12px}
</style>

<!-- Auth screen -->
<div id="auth-screen">
  <div id="auth-box">
    <div class="icon">📚</div>
    <h1>学習進捗管理ツール</h1>
    <p class="sub">ログインしてデータを保存・同期</p>
    <div id="auth-loading">読み込み中...</div>
    <div id="auth-form" hidden>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login-btn">ログイン</button>
        <button class="auth-tab" id="tab-signup-btn">新規登録</button>
      </div>
      <div id="auth-main-view">
        <div class="field"><label>メールアドレス</label><input class="input" id="auth-email" type="email" placeholder="example@email.com" autocomplete="email"></div>
        <div class="field"><label>パスワード</label><input class="input" id="auth-pass" type="password" placeholder="6文字以上" autocomplete="current-password"></div>
        <div class="field" id="auth-pass2-wrap" hidden><label>パスワード（確認）</label><input class="input" id="auth-pass2" type="password" placeholder="もう一度入力" autocomplete="new-password"></div>
        <div id="auth-err"></div>
        <button class="btn primary full" id="auth-submit-btn">ログイン</button>
        <div id="auth-reset-wrap" style="text-align:center;margin-top:12px">
          <button style="font-size:12px;color:var(--fg3);background:none;border:none;cursor:pointer" id="auth-forgot-btn">パスワードを忘れた場合</button>
        </div>
      </div>
      <!-- パスワードリセット画面 -->
      <div id="auth-reset-view" hidden>
        <div style="text-align:center;margin-bottom:16px">
          <div style="font-size:20px;margin-bottom:6px">🔑</div>
          <div style="font-weight:700;margin-bottom:4px">パスワードをリセット</div>
          <div style="font-size:12px;color:var(--fg3)">登録メールアドレスにリセットリンクを送信します</div>
        </div>
        <div class="field"><label>メールアドレス</label><input class="input" id="reset-email" type="email" placeholder="example@email.com"></div>
        <div id="reset-msg" style="font-size:12px;margin-bottom:10px;text-align:center"></div>
        <button class="btn primary full" id="reset-send-btn">リセットメールを送信</button>
        <div style="text-align:center;margin-top:12px">
          <button style="font-size:12px;color:var(--fg3);background:none;border:none;cursor:pointer" id="reset-back-btn">← ログインに戻る</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Main app -->
<div id="app" hidden>
  <div id="header">
    <div id="header-left">
      <h1>学習進捗管理ツール</h1>
      <div id="header-stats">

}

// ============================================================
// THEME
// ============================================================
function applyTheme(idOrColor){
  // Support old accent-color format for backward compat, but prefer theme id
  const t=THEMES.find(t=>t.id===idOrColor)||THEMES[0];
  const r=document.documentElement.style;
  r.setProperty('--bg',t.bg);
  r.setProperty('--bg2',t.bg2);
  r.setProperty('--bg3',t.bg3);
  r.setProperty('--border',t.border);
  r.setProperty('--fg',t.fg);
  r.setProperty('--fg2',t.fg2);
  r.setProperty('--fg3',t.fg3);
  r.setProperty('--accent',t.accent);
  r.setProperty('--accent-bg',hexRgba(t.accent,.12));
  r.setProperty('--accent-border',hexRgba(t.accent,.3));
  r.setProperty('--ok',t.ok);
  r.setProperty('--ok-bg',hexRgba(t.ok,.12));
  r.setProperty('--warn',t.warn);
  r.setProperty('--warn-bg',hexRgba(t.warn,.12));
  r.setProperty('--danger',t.danger);
  r.setProperty('--danger-bg',hexRgba(t.danger,.12));
  document.documentElement.style.colorScheme=t.scheme;
  stow(THEMEK,t.id);themeColor=t.id;
}

async function initApp(user){
  currentUser=user;
  $('auth-screen').hidden=true;
  $('app').hidden=false;
  // load local first (fast)
  mistakes=load(SK,[]);exams=load(EXAMSK,[]);
  themeColor=load(THEMEK,'dark');reviewInterval=load(RIVK,7);
  const ld=load(DK,{date:'',subCount:{},reviewGoal:0,reviewCount:0});
  daily=ld.date===today?ld:{date:today,subCount:{},reviewGoal:0,reviewCount:0};
  applyTheme(themeColor);
  renderAll();
  // merge cloud
  const cd=await cloudLoad();
  if(cd){
    if(cd.mistakes?.length>=mistakes.length){mistakes=cd.mistakes;stow(SK,mistakes);}
    if(cd.exams?.length>0){exams=cd.exams;stow(EXAMSK,exams);}
    if(cd.themeColor)applyTheme(cd.themeColor);
    if(cd.reviewInterval){reviewInterval=cd.reviewInterval;stow(RIVK,reviewInterval);}
    renderAll();
  }
}

function moveSubject(examId,subjId,dir){
  updateExamHeader(examId,ex=>{
    const arr=[...ex.subjects];const i=arr.findIndex(s=>s.id===subjId);
    const j=i+dir;if(j<0||j>=arr.length)return ex;
    [arr[i],arr[j]]=[arr[j],arr[i]];return{...ex,subjects:arr};
  });
  stow(EXAMSK,exams);syncCloud({exams});renderProgress();
}
function moveTextbook(examId,subjId,tbId,dir){
  // まず操作対象の科目で並び替え、並び替え後の教材名順を取得
  let newOrder=null;
  updateExamHeader(examId,ex=>({...ex,subjects:ex.subjects.map(s=>{
    if(s.id!==subjId)return s;
    const arr=[...s.textbooks];const i=arr.findIndex(t=>t.id===tbId);
    const j=i+dir;if(j<0||j>=arr.length)return s;
    [arr[i],arr[j]]=[arr[j],arr[i]];
    newOrder=arr.map(t=>t.name); // 新しい名前順を記録
    return{...s,textbooks:arr};
  })}));
  // 同じ試験の他の科目にも名前順を連動
  if(newOrder){
    exams=exams.map(ex=>{
      if(ex.id!==examId)return ex;
      return{...ex,subjects:ex.subjects.map(s=>{
        if(s.id===subjId)return s; // 操作元はすでに更新済み
        // この科目の教材を newOrder の名前順でソート（含まれない名前は末尾）
        const nameIdx=name=>newOrder.indexOf(name);
        const sorted=[...s.textbooks].sort((a,b)=>{
          const ai=nameIdx(a.name),bi=nameIdx(b.name);
          if(ai===-1&&bi===-1)return 0;
          if(ai===-1)return 1;
          if(bi===-1)return-1;
          return ai-bi;
        });
        return{...s,textbooks:sorted};
      })};
    });
  }
  stow(EXAMSK,exams);syncCloud({exams});renderProgress();
}

function renderProgress(){
  if(displayAxis==='textbook'){renderProgressTextbookAxis();return;}
  // 今日のバー（目標に対して今日何問解いたか）
  const todayBar=$('progress-today-bar');
  if(todayBar){
    const todaySolved=allTextbooks().reduce((s,tb)=>s+((tb.todayLog&&tb.todayLog[today])||0),0);
    if(dailyGoal>0){
      const pct=Math.min(100,Math.round(todaySolved/dailyGoal*100));
      const color=pct>=100?'var(--ok)':pct>=60?'var(--warn)':'var(--accent)';
      todayBar.style.display='block';
      todayBar.innerHTML='';
      const labelRow=document.createElement('div');
      labelRow.style.cssText='display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px';
      const lbl=document.createElement('span');
      lbl.style.cssText='font-size:12px;color:var(--fg2);font-weight:600';
      lbl.textContent='今日の目標';
      const val=document.createElement('span');
      val.style.cssText='font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:'+color;
      val.textContent=todaySolved+' / '+dailyGoal+' 問  ('+pct+'%)';
      labelRow.append(lbl,val);
      const wrap=document.createElement('div');
      wrap.style.cssText='height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden';
      const fill=document.createElement('div');
      fill.style.cssText='height:100%;border-radius:3px;transition:width .4s;background:'+color+';width:'+pct+'%';
      wrap.appendChild(fill);
      todayBar.append(labelRow,wrap);
    } else {
      todayBar.style.display='none';
    }
  }

  const list=$('progress-list');list.innerHTML='';
  if(!exams.length){list.innerHTML='<div class="empty-msg">試験がありません。「＋ 試験追加」から追加してください</div>';return;}
  exams.forEach(exam=>{
    const examSection=el('div',{class:'exam-section',style:{'--exam-color':exam.color||'var(--accent)'}});

    // ── 試験カード集計 ──
    const allTbs=exam.subjects.flatMap(s=>s.textbooks.filter(tb=>!tb.archived));
    const examTotalQ=allTbs.reduce((a,tb)=>a+tb.total,0);
    const examDoneQ=allTbs.reduce((a,tb)=>a+(tb.done||0),0);
    const examPct=examTotalQ>0?Math.min(100,Math.round(examDoneQ/examTotalQ*100)):0;
    const examEnd=exam.examDate||today;
    const examRemaining=Math.max(1,daysBetween(today,examEnd));
    const examLeft=Math.max(0,examTotalQ-examDoneQ);
    // 試験全体の乖離：各教材の ideal 合計 vs done 合計
    const examIdealTotal=allTbs.reduce((a,tb)=>{
      const start=tb.startDate||today;
      const td=daysBetween(start,examEnd)||1;
      const el2=Math.max(0,daysBetween(start,today));
      return a+Math.round(tb.total*(el2/td));
    },0);
    const examGap=examDoneQ-examIdealTotal; // 正=進んでいる 負=遅れ
    const examUnit=examTotalQ>0?(allTbs.some(tb=>/p$|ページ/.test(tb.name))?'p':'問'):'問';

    // ── 試験カードDOM ──
    const examCard=el('div',{class:'exam-card'});
    const head=el('div',{class:'exam-card-head'});

    // タイトル行
    const titleRow=el('div',{class:'exam-card-title-row'});
    const titleLeft=el('div');
    const examDl=exam.examDate?daysBetween(today,exam.examDate):null;
    titleLeft.appendChild(el('div',{class:'exam-card-name'},[exam.name]));
    const subTexts=[];
    if(examDl!==null&&examDl>=0)subTexts.push('あと'+examDl+'日');
    else if(examDl!==null)subTexts.push('終了');
    subTexts.push(exam.subjects.length+'科目');
    titleLeft.appendChild(el('div',{class:'exam-card-sub'},[subTexts.join(' ・ ')]));
    const titleBtns=el('div',{class:'exam-card-btns'});
    titleBtns.appendChild(el('button',{class:'btn ghost sm',onclick:()=>showAddSubjectModal(exam.id)},['＋科目']));
    titleBtns.appendChild(el('button',{class:'btn ghost sm',onclick:()=>showEditExamModal(exam.id)},['編集']));
    titleRow.append(titleLeft,titleBtns);
    head.appendChild(titleRow);

    // 乖離バッジ
    if(examTotalQ>0){
      const badges=el('div',{class:'exam-badges'});
      if(examGap<0){
        const behindDays=examRemaining>0?Math.ceil(Math.abs(examGap)/Math.max(1,examDoneQ/(Math.max(1,daysBetween(exam.subjects[0]?.textbooks[0]?.startDate||today,today)||1)))):0;
        badges.appendChild(el('span',{class:'ebadge delay'},['🕐 '+(Math.abs(examGap))+examUnit+'遅れ']));
      } else if(examGap>0){
        badges.appendChild(el('span',{class:'ebadge ok'},['▲ +'+examGap+examUnit]));
      }
      if(examLeft>0&&examRemaining>0){
        const pace=Math.ceil(examLeft/examRemaining);
        badges.appendChild(el('span',{class:'ebadge pace',style:{background:'rgba(245,200,66,.1)',color:'var(--warn)',borderColor:'rgba(245,200,66,.25)'}},['残'+examLeft+examUnit+' ・ '+pace+examUnit+'/日']));
      }
      if(badges.children.length)head.appendChild(badges);
    }

    // 進捗バー＋%
    if(examTotalQ>0){
      const pctRow=el('div',{class:'exam-pct-row'});
      const pctColor=examPct>=80?'var(--ok)':examPct>=50?'var(--warn)':'var(--danger)';
      pctRow.appendChild(el('span',{class:'exam-pct',style:{color:pctColor}},[examPct+'%']));
      pctRow.appendChild(el('span',{class:'exam-total'},[examDoneQ+'/'+examTotalQ+examUnit]));
      head.appendChild(pctRow);
      const barWrap=el('div',{class:'exam-bar-wrap'});
      barWrap.appendChild(el('div',{class:'exam-bar-fill',style:{width:examPct+'%',background:pctColor}}));
      head.appendChild(barWrap);
    }

    examCard.appendChild(head);
    examSection.appendChild(examCard);

    // ── 科目ブロック（インデント） ──
    if(!exam.subjects.length){
      examSection.appendChild(el('div',{class:'subj-indent',style:{color:'var(--fg3)',fontSize:'12px',padding:'6px 4px'}},'科目がありません'));
      list.appendChild(examSection);return;
    }
    exam.subjects.forEach((subj,si)=>{
      const subjWrap=el('div',{class:'subj-indent'});
      const subjBlock=el('div',{class:'card book-block',style:{marginBottom:'8px','--subj-color':subj.color||'var(--border)'}});
      const subjHead=el('div',{class:'book-label',style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
      const subjLeft2=el('div',{style:{display:'flex',alignItems:'center',gap:'6px'}});
      subjLeft2.appendChild(el('span',{style:{color:subj.color||'var(--fg)'}},[subj.name]));
      const subjSortBtns=el('div',{style:{display:'flex',gap:'2px'}});
      if(si>0)subjSortBtns.appendChild(el('button',{class:'sort-btn',title:'上へ',onclick:e=>{e.stopPropagation();moveSubject(exam.id,subj.id,-1);}},['↑']));
      if(si<exam.subjects.length-1)subjSortBtns.appendChild(el('button',{class:'sort-btn',title:'下へ',onclick:e=>{e.stopPropagation();moveSubject(exam.id,subj.id,1);}},['↓']));
      subjLeft2.appendChild(subjSortBtns);
      const subjBtns=el('div',{style:{display:'flex',gap:'4px'}});
      subjBtns.appendChild(el('button',{class:'btn ghost sm',style:{fontSize:'11px',padding:'3px 8px'},onclick:()=>showAddTextbookModal(exam.id,subj.id)},['＋教材']));
      subjHead.append(subjLeft2,subjBtns);
      subjBlock.appendChild(subjHead);

      const tbs=showArchived?subj.textbooks:subj.textbooks.filter(tb=>!tb.archived);
      if(!tbs.length){
        subjBlock.appendChild(el('div',{style:{color:'var(--fg3)',fontSize:'11px',padding:'8px 12px'}},'教材がありません'));
        subjWrap.appendChild(subjBlock);examSection.appendChild(subjWrap);return;
      }
      const st=subStyle(subj.color);
      const gridWrap=el('div',{style:{overflowX:'auto',paddingBottom:'2px'}});
      const grid=el('div',{class:'sub-grid'});

      tbs.forEach((tb,ti)=>{
        const unit=bookUnit(tb.name);
        const pct=tb.total>0?Math.min(100,Math.round((tb.done||0)/tb.total*100)):0;
        const todayAdded=(tb.todayLog&&tb.todayLog[today])||0;
        const start=tb.startDate||today;
        const end=tb.endDate||exam.examDate||today;
        const totalDays=daysBetween(start,end)||1;
        const elapsed=Math.max(0,daysBetween(start,today));
        const remaining=Math.max(1,daysBetween(today,end));
        const ideal=Math.round(tb.total*(elapsed/totalDays));
        const gap=(tb.done||0)-ideal;          // 正=進んでいる
        const left=Math.max(0,tb.total-(tb.done||0));
        const surplus=left>0?Math.ceil(left/remaining):0;
        const delayDays=gap<0&&todayAdded>0?Math.ceil(Math.abs(gap)/todayAdded):
                         gap<0&&surplus>0?Math.ceil(Math.abs(gap)/surplus):0;

        const pctColor=pct>=80?st.text:pct>=50?'var(--warn)':'var(--danger)';
        const cell=el('div',{class:'sub-cell',style:{background:st.bg,borderColor:st.border}});

        // 教材名＋ソートボタン
        const nameRow=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'6px'}});
        const nameEl=el('div',{class:'name',style:{color:st.text,cursor:'pointer',flex:'1',lineHeight:'1.3'},title:'目標を編集',onclick:()=>showEditTextbookGoalModal(exam.id,subj.id,tb.id)},[tb.name]);
        const tbSort=el('div',{style:{display:'flex',gap:'1px',marginLeft:'3px',flexShrink:'0'}});
        if(ti>0)tbSort.appendChild(el('button',{class:'sort-btn',style:{width:'18px',height:'18px',fontSize:'10px'},onclick:e=>{e.stopPropagation();moveTextbook(exam.id,subj.id,tb.id,-1);}},['↑']));
        if(ti<tbs.length-1)tbSort.appendChild(el('button',{class:'sort-btn',style:{width:'18px',height:'18px',fontSize:'10px'},onclick:e=>{e.stopPropagation();moveTextbook(exam.id,subj.id,tb.id,1);}},['↓']));
        nameRow.append(nameEl,tbSort);

        // 進捗バー
        const bar=el('div',{class:'progress-bar',style:{height:'6px'}});
        bar.appendChild(el('div',{class:'progress-fill',style:{width:pct+'%',background:pctColor}}));

        // done/total ＋ %
        const pctRow=el('div',{class:'pct-row'});
        pctRow.appendChild(el('span',{class:'done-lbl'},[`${tb.done||0}/${tb.total}${unit}`]));
        pctRow.appendChild(el('span',{class:'pct-lbl',style:{color:pctColor}},[pct+'%']));

        cell.append(nameRow,bar,pctRow);

        if(pct>=100){
          cell.appendChild(el('button',{class:'archive-btn-mini',onclick:()=>archiveTextbook(exam.id,subj.id,tb.id)},['🌸 完了']));
        } else {
          // バッジ行（遅れ・赤・目安ペース）
          const badgeRow=el('div',{class:'cell-badges'});
          if(gap<0)badgeRow.appendChild(el('span',{class:'cbadge behind'},['赤'+Math.abs(gap)+unit]));
          if(delayDays>0)badgeRow.appendChild(el('span',{class:'cbadge delay'},['🕐 '+delayDays+'日遅れ']));
          if(surplus>0)badgeRow.appendChild(el('span',{class:'cbadge pace'},[surplus+unit+'/日']));
          if(todayAdded>0)badgeRow.appendChild(el('span',{class:'cbadge today'},['今日+'+todayAdded]));
          if(badgeRow.children.length)cell.appendChild(badgeRow);

          // ±ボタン
          const dRow=el('div',{class:'delta-row'});
          [-1,1,5,10].forEach(d=>{
            const btn=el('button',{class:'delta-btn'+(d<0?' minus':''),onclick:()=>updTextbook(exam.id,subj.id,tb.id,d)},[(d>0?'+':'')+d]);
            dRow.appendChild(btn);
          });
          cell.appendChild(dRow);

          if(tb.archived)cell.appendChild(el('button',{class:'archive-btn-mini',style:{background:'rgba(255,255,255,.04)',color:'var(--fg3)',borderColor:'var(--border)'},onclick:()=>restoreTextbook(exam.id,subj.id,tb.id)},['復元']));
        }
        grid.appendChild(cell);
      });
      gridWrap.appendChild(grid);
      subjBlock.appendChild(gridWrap);
      subjWrap.appendChild(subjBlock);
      examSection.appendChild(subjWrap);
    });
    list.appendChild(examSection);
  });
}

        if(badgeRow.children.length)cell.appendChild(badgeRow);
        const dRow=el('div',{class:'delta-row'});
        [-1,1,5,10].forEach(d=>{dRow.appendChild(el('button',{class:'delta-btn'+(d<0?' minus':''),onclick:()=>updTextbook(examId,subjId,tb.id,d)},[(d>0?'+':'')+d]));});
        cell.appendChild(dRow);
      }
      grid.appendChild(cell);
    });
    gridWrap.appendChild(grid);
    section.appendChild(gridWrap);
    list.appendChild(section);
  });
}

let dailyGoal=parseInt(localStorage.getItem('daily-goal-v1')||'0')||0;

// 目標連続達成日数の計算
function calcGoalStreak(){
  if(!dailyGoal)return 0;
  // 過去90日分を遡って連続達成日数を計算
  const allTbs=allTextbooks();
  let streak=0;
  for(let i=0;i<90;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=[d.getFullYear(),(d.getMonth()+1).toString().padStart(2,'0'),d.getDate().toString().padStart(2,'0')].join('-');
    const dayTotal=allTbs.reduce((s,tb)=>s+((tb.todayLog&&tb.todayLog[ds])||0),0);
    if(dayTotal>=dailyGoal)streak++;
    else break;
  }
  return streak;
}
let todayOk=0,todayTotal=0; // 今日の正答数・総問数

function updateStudyStats(){
  const total=Object.values(daily.subCount||{}).reduce((a,b)=>a+b,0);
  $('study-today').textContent='今日 '+total+'問';
  // ペース計算
  const goal=dailyGoal;
  const paceEl=$('pace-info');
  if(goal>0&&total>0){
    const now=new Date();
    const startOfDay=new Date(now.getFullYear(),now.getMonth(),now.getDate(),6,0,0); // 6時スタート想定
    const elapsed=(now-startOfDay)/1000/60; // 分
    const rate=total/elapsed; // 問/分
    const remaining=Math.max(0,goal-total);
    if(remaining<=0){
      paceEl.innerHTML='<span style="color:var(--ok);font-weight:700">🎉 今日の目標達成！</span>';
    }else if(rate>0){
      const eta=Math.ceil(remaining/rate);
      const h=Math.floor(eta/60),m=eta%60;
      const etaStr=h>0?`${h}時間${m}分`:`${m}分`;
      paceEl.textContent=`${total}/${goal}問 ・ このペースであと ${etaStr}`;
    }else{
      paceEl.textContent=`${total}/${goal}問`;
    }
  }else if(goal>0){
    paceEl.textContent=`0/${goal}問`;
  }else{
    paceEl.textContent='';
  }
  // 正答率
  const accBar=$('accuracy-bar');
  if(todayTotal>0){
    accBar.hidden=false;
    const pct=Math.round(todayOk/todayTotal*100);
    $('accuracy-fill').style.width=pct+'%';
    $('accuracy-fill').style.background=pct>=80?'var(--ok)':pct>=60?'var(--warn)':'var(--danger)';
    $('accuracy-label').textContent=pct+'%';
    $('accuracy-label').style.color=pct>=80?'var(--ok)':pct>=60?'var(--warn)':'var(--danger)';
    $('accuracy-detail').textContent=`${todayOk}/${todayTotal}問`;
  }else{
    accBar.hidden=true;
  }
}

function recordAnswer(type){
  const pno=$('prob-no').value.trim(),memo=$('prob-memo').value.trim();
  if(!pno)return;
  const sub=$('study-sub').value,book=$('study-book').value;
  const now=Date.now();
  const existing=mistakes.find(m=>m.subject===sub&&m.textbook===book&&m.problemNo===pno);
  const subObj=allSubjects().find(s=>s.name===sub);
  if(existing){
    mistakes=mistakes.map(m=>{if(m.subject!==sub||m.textbook!==book||m.problemNo!==pno)return m;return{...m,missCount:(m.missCount||0)+(type==='○'?0:1),lastMissed:now,consecutiveCorrect:type==='○'?(m.consecutiveCorrect||0)+1:0,memo:memo||m.memo};});
  }else{
    mistakes=[...mistakes,{id:now,subject:sub,textbook:book,subjectColor:subObj?.color||'',problemNo:pno,memo,missCount:type==='○'?0:1,lastMissed:now,consecutiveCorrect:type==='○'?1:0,addedDate:today,reviewedDates:[]}];
  }
  stow(SK,mistakes);syncNow({mistakes});
  daily.subCount=daily.subCount||{};
  const key=sub+'___'+book;
  daily.subCount[key]=(daily.subCount[key]||0)+1;
  stow(DK,daily);
  // 正答率カウント
  todayTotal++;
  if(type==='○')todayOk++;
  lastAns={type,pno,sub,book};
  $('undo-area').hidden=false;
  $('last-ans-label').textContent='#'+pno+' '+type;
  $('prob-no').value='';$('prob-memo').value='';
  updateStudyStats();
  renderHeader();renderMistakeStats();
}

$('undo-btn').onclick=()=>{
  if(!lastAns)return;
  mistakes=mistakes.map(m=>{if(m.subject===lastAns.sub&&m.textbook===lastAns.book&&m.problemNo===lastAns.pno)return{...m,missCount:Math.max(0,(m.missCount||0)-(lastAns.type==='○'?0:1)),consecutiveCorrect:Math.max(0,(m.consecutiveCorrect||0)-(lastAns.type==='○'?1:0))};return m;});
  // 正答率undo
  todayTotal=Math.max(0,todayTotal-1);
  if(lastAns.type==='○')todayOk=Math.max(0,todayOk-1);
  // 問題数undo
  const key=lastAns.sub+'___'+lastAns.book;
  if(daily.subCount&&daily.subCount[key])daily.subCount[key]=Math.max(0,daily.subCount[key]-1);
  stow(DK,daily);
  stow(SK,mistakes);syncNow({mistakes});lastAns=null;$('undo-area').hidden=true;
  updateStudyStats();renderHeader();renderMistakeStats();
};

  const sortFn=(a,b)=>sort==='miss'?(b.missCount||0)-(a.missCount||0):(b.lastMissed||0)-(a.lastMissed||0);

  const body=el('div',{class:'qcard-body',hidden:true});
  const pills=el('div',{class:'qcard-pills'});
  if(q.category)pills.appendChild(el('span',{class:'pill',style:{background:'rgba(255,255,255,.07)',color:'var(--fg2)'}},[q.category]));

  const memoTA=el('textarea',{class:'input',style:{width:'100%',resize:'none',marginTop:'8px',fontSize:'13px'},rows:'2'});
  memoTA.value=q.memo||'';
  const saveBtn=el('button',{class:'btn ghost sm',style:{marginTop:'6px'},onclick:()=>{mistakes=mistakes.map(m=>m.id===q.id?{...m,memo:memoTA.value}:m);stow(SK,mistakes);syncNow({mistakes});}},['保存']);
  const revBtns=el('div',{class:'rev-btns'});
  if(isReminder){
    revBtns.appendChild(el('button',{class:'rev-btn rev-ok',onclick:()=>reviewMistake(q.id,'ok')},['✅']));
    revBtns.appendChild(el('button',{class:'rev-btn rev-tri',onclick:()=>reviewMistake(q.id,'tri')},['△']));
    revBtns.appendChild(el('button',{class:'rev-btn rev-ng',onclick:()=>reviewMistake(q.id,'ng')},['＋']));
  }else{
    revBtns.appendChild(el('button',{class:'rev-btn rev-ok',style:{opacity:'.6'},onclick:()=>reviewMistake(q.id,'ok')},['✅']));
    revBtns.appendChild(el('button',{class:'rev-btn rev-ng',style:{opacity:'.6'},onclick:()=>reviewMistake(q.id,'ng')},['＋']));
  }
  revBtns.appendChild(el('button',{class:'rev-btn rev-del',onclick:()=>{if(!confirm('削除しますか？'))return;mistakes=mistakes.filter(m=>m.id!==q.id);stow(SK,mistakes);syncNow({mistakes});renderAll();}},['🗑']));
  body.append(pills,memoTA,saveBtn,revBtns);
  head.onclick=()=>{const open=!body.hidden;body.hidden=open;head.querySelector('.chevron').textContent=open?'▼':'▲';};
  card.append(head,body);return card;
}

function reviewMistake(id,action){
  const m=mistakes.find(m=>m.id===id);if(!m)return;
  lastRem={id,prev:{...m}};$('undo-rem-wrap').hidden=false;
  mistakes=mistakes.map(x=>{if(x.id!==id)return x;if(action==='ok')return{...x,lastMissed:Date.now(),consecutiveCorrect:(x.consecutiveCorrect||0)+1,reviewedDates:[...(x.reviewedDates||[]),today]};if(action==='tri')return{...x,lastMissed:Date.now(),consecutiveCorrect:0};return{...x,missCount:(x.missCount||0)+1,lastMissed:Date.now(),consecutiveCorrect:0};});
  stow(SK,mistakes);syncNow({mistakes});renderMistakeList();renderMistakeStats();renderHeader();
}

  openModal(modal);
}

// ============================================================
function renderShare(){
  $('share-date').textContent=today;

  // 今日進んだ教材
  const allTbs=allTextbooks();
  const todayTbs=allTbs.map(tb=>({...tb,todayAdded:(tb.todayLog&&tb.todayLog[today])||0})).filter(tb=>tb.todayAdded>0);
  const total=todayTbs.reduce((s,tb)=>s+tb.todayAdded,0);
  const todayMiss=mistakes.filter(m=>m.addedDate===today).length;

  $('share-total').textContent=total;

  // 今日の目標チップ
  const goalChip=$('today-goal-chip');
  if(dailyGoal>0){
    const pctOfGoal=Math.min(100,Math.round(total/dailyGoal*100));
    const color=pctOfGoal>=100?'var(--ok)':pctOfGoal>=60?'var(--warn)':'var(--danger)';
    goalChip.textContent='目標 '+total+'/'+dailyGoal+' ('+pctOfGoal+'%)';
    goalChip.style.color=color;
    goalChip.hidden=false;
  } else {
    goalChip.hidden=true;
  }

  $('share-miss-stat').textContent=todayMiss>0?'ミス '+todayMiss+'問':'';

  // 連続達成日数
  const streakEl=$('share-streak-stat');
  if(dailyGoal>0){
    const streak=calcGoalStreak();
    if(streak>=1){
      streakEl.textContent='🔥 '+streak+'日連続達成';
      streakEl.style.color=streak>=7?'var(--warn)':'var(--ok)';
    } else {
      streakEl.textContent='';
    }
  } else {
    streakEl.textContent='';
  }
  $('share-empty').hidden=todayTbs.length>0;
  $('share-log-title').hidden=todayTbs.length===0;

  // 今日100%達成した教材
  const completedToday=allTbs.filter(tb=>{
    if(tb.total<=0)return false;
    const pct=Math.round((tb.done||0)/tb.total*100);
    const prevDone=Math.max(0,(tb.done||0)-((tb.todayLog&&tb.todayLog[today])||0));
    const prevPct=Math.round(prevDone/tb.total*100);
    return pct>=100&&prevPct<100;
  });
  const completeSection=$('share-complete-section');
  const completeList=$('share-complete-list');
  completeList.innerHTML='';
  if(completedToday.length){
    completeSection.hidden=false;
    completedToday.forEach(tb=>{
      const unit=bookUnit(tb.name);
      const row=el('div',{class:'complete-row'});
      row.appendChild(el('span',{class:'complete-icon'},['🌸']));
      const info=el('div',{class:'complete-info'});
      info.appendChild(el('div',{class:'complete-name'},[tb.name]));
      info.appendChild(el('div',{class:'complete-sub'},[tb.subjectName+' ・ '+tb.total+unit+' 完了']));
      row.appendChild(info);
      row.appendChild(el('span',{class:'complete-badge'},['100%']));
      completeList.appendChild(row);
    });
  } else {
    completeSection.hidden=true;
  }

  // 今日の記録一覧（科目ごと）
  const booksDiv=$('share-books');booksDiv.innerHTML='';
  const subMap={};
  todayTbs.forEach(tb=>{(subMap[tb.subjectName]=subMap[tb.subjectName]||{color:tb.subjectColor,tbs:[]}).tbs.push(tb);});
  Object.entries(subMap).forEach(([subName,{color,tbs}])=>{
    const block=el('div',{class:'card book-block',style:{marginBottom:'8px'}});
    block.appendChild(el('div',{class:'book-label'},[subName]));
    const gridWrap=el('div',{style:{overflowX:'auto'}});
    const grid=el('div',{class:'sub-grid'});
    tbs.forEach(tb=>{
      const unit=bookUnit(tb.name);
      const st=subStyle(color);
      const pct=tb.total>0?Math.min(100,Math.round((tb.done||0)/tb.total*100)):0;
      const pctColor=pct>=100?'var(--ok)':pct>=50?st.text:'var(--warn)';
      const cell=el('div',{class:'sub-cell',style:{background:st.bg,borderColor:st.border,textAlign:'center'}});
      cell.append(
        el('div',{class:'name',style:{color:st.text}},[tb.name]),
        el('div',{style:{color:'var(--accent)',fontWeight:'700',fontSize:'14px',margin:'4px 0'}},['＋'+tb.todayAdded+unit]),
        el('div',{style:{color:'var(--fg3)',fontSize:'11px'}},[(tb.done||0)+'/'+tb.total+unit]),
        el('div',{style:{color:pctColor,fontWeight:'700',fontSize:'13px'}},[pct+'%'])
      );
      if(pct>=100)cell.appendChild(el('div',{style:{fontSize:'16px',marginTop:'4px'}},['🌸']));
      grid.appendChild(cell);
    });
    gridWrap.appendChild(grid);block.appendChild(gridWrap);booksDiv.appendChild(block);
  });
}

$('copy-share-btn').onclick=()=>{
  const lines=['📚 学習記録 '+today];
  // 登録されている試験すべて（試験日あり・今日以降）を近い順に列挙
  const upcoming=exams.filter(ex=>ex.examDate&&daysBetween(today,ex.examDate)>=0).sort((a,b)=>daysBetween(today,a.examDate)-daysBetween(today,b.examDate));
  if(upcoming.length){
    upcoming.forEach(ex=>lines.push('📅 '+ex.name+' まで'+daysBetween(today,ex.examDate)+'日'));
  }
  const todayTbs=allTextbooks().map(tb=>({...tb,todayAdded:(tb.todayLog&&tb.todayLog[today])||0})).filter(tb=>tb.todayAdded>0);
  if(todayTbs.length){lines.push('');lines.push('【進捗】');todayTbs.forEach(tb=>lines.push(tb.subjectName+' '+tb.name+': +'+tb.todayAdded+bookUnit(tb.name)+' ('+Math.min(100,Math.round((tb.done||0)/tb.total*100))+'%)'));}
  const tm=mistakes.filter(m=>m.addedDate===today).length;
  if(tm>0){lines.push('');lines.push('【ミス】'+tm+'問');}
  if(dailyGoal>0){
    const total=todayTbs.reduce((s,tb)=>s+tb.todayAdded,0);
    const streak=calcGoalStreak();
    lines.push('');
    lines.push('【目標】'+total+'/'+dailyGoal+'問'+(streak>=1?' 🔥'+streak+'日連続':''));
  }
  navigator.clipboard?.writeText(lines.join('\n')).catch(()=>{});
  $('copy-share-btn').textContent='✅ コピーしました';
  setTimeout(()=>$('copy-share-btn').textContent='📋 テキストでコピー',2000);
};

function showSettingsModal(){
  const modal=makeModal('設定');
  const themeLabel=el('div',{class:'field'},[el('label',{},'テーマ')]);
  const pal=el('div',{class:'theme-palette'});
  THEMES.forEach(t=>{
    const dot=el('div',{class:'theme-dot'+(t.id===themeColor?' selected':''),'data-theme':t.id,style:{background:t.swatch},title:t.label,onclick:()=>{document.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('selected'));dot.classList.add('selected');applyTheme(t.id);syncCloud({themeColor:t.id});}});
    pal.appendChild(dot);
  });
  themeLabel.appendChild(pal);
  const rivIn=el('input',{class:'input',type:'number',style:{width:'70px'}});
  rivIn.value=String(reviewInterval);
  rivIn.addEventListener('input',()=>{const v=parseInt(rivIn.value)||7;reviewInterval=v;stow(RIVK,reviewInterval);$('review-interval').value=reviewInterval;renderMistakeStats();renderHeader();});
  rivIn.addEventListener('change',()=>{const v=parseInt(rivIn.value)||7;reviewInterval=v;stow(RIVK,reviewInterval);$('review-interval').value=reviewInterval;renderMistakeStats();renderHeader();});
  const rivField=el('div',{class:'field'},[el('label',{},'復習間隔（日）'),rivIn]);
  // 表示軸トグル
  function makeToggleRow(labelText,descText,isOn,onChange){
    const row=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'12px',padding:'10px 0',borderBottom:'1px solid var(--border)'}});
    const left=el('div');
    left.appendChild(el('div',{style:{fontSize:'13px',color:'var(--fg)',fontWeight:'600',marginBottom:'2px'}},[labelText]));
    if(descText)left.appendChild(el('div',{style:{fontSize:'11px',color:'var(--fg3)',lineHeight:'1.4'}},[descText]));
    const sw=el('div',{style:{position:'relative',width:'40px',height:'22px',flexShrink:'0',cursor:'pointer',marginTop:'2px'}});
    const track=el('div',{style:{position:'absolute',inset:'0',borderRadius:'11px',background:isOn?'var(--accent)':'rgba(255,255,255,.12)',transition:'background .2s'}});
    const knob=el('div',{style:{position:'absolute',top:'3px',left:isOn?'21px':'3px',width:'16px',height:'16px',borderRadius:'50%',background:'#fff',transition:'left .2s',boxShadow:'0 1px 3px rgba(0,0,0,.3)'}});
    sw.append(track,knob);
    let state=isOn;
    sw.onclick=()=>{state=!state;track.style.background=state?'var(--accent)':'rgba(255,255,255,.12)';knob.style.left=state?'21px':'3px';onChange(state);};
    row.append(left,sw);
    return row;
  }
  const axisSection=el('div',{style:{margin:'4px 0 2px'}});
  axisSection.appendChild(el('div',{style:{fontSize:'11px',color:'var(--fg3)',fontWeight:'700',letterSpacing:'.05em',margin:'8px 0 4px'}},'進捗タブの表示'));
  axisSection.appendChild(makeToggleRow(
    '教材軸で表示',
    '教材名でまとめ、各科目の進捗を横並び表示\n（OFFで科目軸 = 科目の中に教材を表示）',
    displayAxis==='textbook',
    v=>{displayAxis=v?'textbook':'subject';localStorage.setItem('display-axis-v1',displayAxis);if(currentTab==='progress')renderProgress();}
  ));
  axisSection.appendChild(makeToggleRow(
    '目標数をロック',
    '教材名をタップしても目標数を変更できなくする',
    goalLock,
    v=>{goalLock=v;localStorage.setItem('goal-lock-v1',v?'1':'0');}
  ));

  const userInfo=el('div',{style:{borderTop:'1px solid var(--border)',paddingTop:'14px',marginTop:'6px'}});
  userInfo.appendChild(el('div',{style:{fontSize:'12px',color:'var(--fg3)',marginBottom:'4px'}},'ログイン中'));
  userInfo.appendChild(el('div',{style:{fontSize:'13px',color:'var(--fg2)',marginBottom:'10px'}},[currentUser?.email||'']));
  const pwBtn=el('button',{class:'btn ghost sm full',onclick:async()=>{
    const email=currentUser?.email||'';if(!email)return;
    pwBtn.textContent='送信中...';pwBtn.disabled=true;
    const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'?reset=1'});
    pwBtn.textContent=error?'送信失敗':'✅ パスワード変更メールを送信しました';
    setTimeout(()=>{pwBtn.textContent='パスワードを変更する';pwBtn.disabled=false;},3000);
  }},['パスワードを変更する']);
  userInfo.appendChild(pwBtn);

  // データリセットゾーン
  const resetZone=el('div',{style:{borderTop:'1px solid var(--border)',paddingTop:'14px',marginTop:'14px'}});
  resetZone.appendChild(el('div',{style:{fontSize:'11px',color:'var(--fg3)',fontWeight:'700',letterSpacing:'.05em',marginBottom:'10px'}},'データリセット'));

  // 間違いノートだけリセット
  const resetMistakesBtn=el('button',{class:'btn ghost sm full',style:{color:'var(--warn)',borderColor:'rgba(245,200,66,.3)',marginBottom:'8px'},onclick:()=>{
    if(!confirm('間違いノートのデータをすべて削除しますか？\nこの操作は元に戻せません。'))return;
    mistakes=[];stow(SK,mistakes);syncCloud({mistakes});closeModal();renderAll();
  }},['間違いノートをリセット']);

  // 試験・進捗だけリセット（アーカイブ済み含む）
  const resetExamsBtn=el('button',{class:'btn ghost sm full',style:{color:'var(--warn)',borderColor:'rgba(245,200,66,.3)',marginBottom:'8px'},onclick:()=>{
    if(!confirm('試験・科目・教材のデータをすべて削除しますか？\nアーカイブ済みの教材も含まれます。\nこの操作は元に戻せません。'))return;
    exams=[];stow(EXAMSK,exams);syncCloud({exams});closeModal();renderAll();
  }},['試験・進捗データをリセット（アーカイブ含む）']);

  // 全データリセット
  const resetAllBtn=el('button',{class:'btn ghost sm full',style:{color:'var(--danger)',borderColor:'rgba(232,83,74,.3)'},onclick:()=>{
    if(!confirm('すべてのデータを削除しますか？\n・間違いノート\n・試験・科目・教材（アーカイブ含む）\n\nこの操作は元に戻せません。'))return;
    if(!confirm('本当に削除しますか？（確認）'))return;
    mistakes=[];exams=[];
    stow(SK,mistakes);stow(EXAMSK,exams);
    syncCloud({mistakes,exams});
    closeModal();renderAll();
  }},['すべてのデータを削除']);

  resetZone.append(resetMistakesBtn,resetExamsBtn,resetAllBtn);
  modal.append(themeLabel,rivField,axisSection,userInfo,resetZone);
  openModal(modal);
}

function doExport(){
  const data=JSON.stringify({mistakes,exams,themeColor,reviewInterval},null,2);
  navigator.clipboard?.writeText(data).then(()=>alert('クリップボードにコピーしました')).catch(()=>showImportModal());
}
function showImportModal(){
  const modal=makeModal('インポート');
  const ta=el('textarea',{class:'input',rows:'10',style:{width:'100%',resize:'vertical',fontSize:'11px',fontFamily:'monospace'},placeholder:'バックアップJSONを貼り付け'});
  const importBtn=el('button',{class:'btn primary full mt8',onclick:()=>{
    try{
      const d=JSON.parse(ta.value);
      if(d.mistakes){mistakes=d.mistakes;stow(SK,mistakes);}
      if(d.exams){exams=d.exams;stow(EXAMSK,exams);}
      if(d.themeColor)applyTheme(d.themeColor);
      if(d.reviewInterval){reviewInterval=d.reviewInterval;stow(RIVK,reviewInterval);}
      cloudSave(getPayload());closeModal();renderAll();alert('インポート完了');
    }catch{alert('JSONが正しくありません');}
  }},['インポート実行']);
  modal.append(ta,importBtn);
  openModal(modal);
}

function makeModal(title){
  const m=el('div',{class:'modal'});

  head.appendChild(el('h2',{},[title]));
  head.appendChild(el('button',{class:'close-btn',onclick:closeModal},['✕']));

}
function openModal(m){
  const root=$('modal-root');root.innerHTML='';
  const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)closeModal();}});
  bg.appendChild(m);root.appendChild(bg);
}
